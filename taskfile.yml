version: "3"

tasks:
  install_tools:
    desc: Install all dependencies for the project
    cmds:
      - chmod +x ./scripts/install-tools.sh
      - ./scripts/install-tools.sh

  sync:
    desc: Install the exact dependencies in the lockfiles (run after cloning or pulling)
    cmds:
      - poetry sync
      - pnpm install --frozen-lockfile

  upgrade:
    desc: Upgrade all dependencies to their latest versions and update the lockfiles
    cmds:
      - poetry update
      - pnpm update --latest

  run_ci:
    desc: Run the CI pipeline locally
    cmds:
      - act -n

  add:
    desc: Add a new package to the project
    cmds:
      - poetry add {{.PACKAGE}}
    requires:
      vars: [PACKAGE]

  add_dev:
    desc: Add a new package to the project as a development dependency
    cmds:
      - poetry add {{.PACKAGE}} --group dev
    requires:
      vars: [PACKAGE]

  test:
    desc: Run all tests with verbose output or a specific test file
    vars:
      FILE: "{{.FILE}}"
    cmds:
      - poetry run pytest {{if .FILE}}tests/test_{{.FILE}}.py{{else}}-v{{end}}

  format:
    desc: Run code formatting and remove unused imports using Ruff
    cmds:
      - poetry run ruff check --select I,F401 --fix
      - poetry run ruff format

  lint:
    desc: Run linting using Ruff and Pyrefly
    cmds:
      # bare `ruff check` honours [tool.ruff.lint] select, including the S
      # (flake8-bandit) security rules; task format overrides select, so it
      # cannot stand in for this.
      - poetry run ruff check
      - poetry run pyrefly check

  deadcode:
    desc: Detect dead code using Vulture
    cmds:
      - poetry run vulture
