[project]
name = "poetry-template"
version = "1.0.0"
description = "This is poetry template"
readme = "README.md"
requires-python = ">=3.14,<4.0"
authors = [{ name = "Raphael Discky", email = "raph.discky@gmail.com" }]
dependencies = [
    "requests>=2.34.2",
]

[tool.poetry]
packages = [
    { include = "my_package", from = "src" },
    { include = "example", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-mock = "^3.15.1"
pyrefly = "^1.2.0"
ruff = "^0.16.3"
vulture = "^2.16"

[tool.ruff]
line-length = 90
indent-width = 2

[tool.ruff.lint]
select = ["I", "F401", "S"]

[tool.ruff.lint.per-file-ignores]
# asserts are the entire point of a test
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.vulture]
min_confidence = 60
# tests are scanned too: they exercise the example package, so scanning src
# alone would report the scaffolding as dead.
paths = ["src", "tests"]

[tool.pyrefly]
project_includes = ["**/*"]
project_excludes = [
    "**/.[!/.]*",
    "**/*venv/**/*",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
