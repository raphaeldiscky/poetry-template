name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Installs python, poetry, node and pnpm from .prototools — the single
      # source of truth for every toolchain version in this repo.
      - name: Setup Toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: task sync

      - name: Format Check
        run: |
          task format
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after 'task format'. Please run it locally."
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Lint
        run: task lint

      - name: Dead Code Check
        run: task deadcode

      - name: Test
        run: task test
